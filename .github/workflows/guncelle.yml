name: İlanları güncelle

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Botu çalıştır
        run: node scraper/guncelle.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "ilan-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "İlanlar güncellendi: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
